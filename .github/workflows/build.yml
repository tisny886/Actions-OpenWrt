name: Build TR3600

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "configs/**"
      - "scripts/**"
      - "files/**"
      - "patches/**"
      - "README.md"

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    name: TR3600 / ImmortalWrt 6.6 / 237
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          sudo apt-get clean

          echo "===== DISK ====="
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            swig \
            time \
            ccache \
            rename \
            device-tree-compiler \
            libelf-dev

          echo "===== TOOLCHAIN ====="
          gcc --version
          g++ --version
          clang --version
          python3 --version
          python3 -m pip --version || true

      - name: Clone 237 ImmortalWrt 6.6
        run: |
          git clone --depth=1 --single-branch \
            -b "${SOURCE_BRANCH}" \
            "${SOURCE_REPO}" openwrt

          cd openwrt

          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          echo "===== SOURCE ====="
          git remote -v
          git branch --show-current
          git log -1 --oneline

      - name: Apply TR3600 support and packages
        run: |
          set -e

          if [ ! -d scripts ]; then
            echo "ERROR: scripts directory not found."
            exit 1
          fi

          chmod +x scripts/*.sh

          ./scripts/prepare.sh

      - name: Install feeds
        working-directory: openwrt
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          set -e

          if [ ! -f ../configs/tr3600-237.config ]; then
            echo "ERROR: configs/tr3600-237.config not found."
            exit 1
          fi

          cp ../configs/tr3600-237.config .config

          make defconfig

          echo "===== TARGET ====="
          grep -E \
            'CONFIG_TARGET_mediatek|CONFIG_TARGET_DEVICE.*tr3600' \
            .config || true

          echo "===== FIREWALL ====="
          grep -E \
            'CONFIG_PACKAGE_(firewall3|firewall4|iptables|nftables)=' \
            .config || true

          echo "===== TR3600 ====="
          grep -Ei \
            'tr3600|cudy' \
            .config || true

      - name: Verify configuration
        working-directory: openwrt
        run: |
          set -e

          if [ ! -f ../scripts/verify.sh ]; then
            echo "ERROR: scripts/verify.sh not found."
            exit 1
          fi

          chmod +x ../scripts/verify.sh
          ../scripts/verify.sh

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          echo "===== DOWNLOAD ====="
          make -j"$(nproc)" download

          echo "===== BUILD ====="
          make -j"$(nproc)" V=s

      - name: Collect firmware
        run: |
          set -e

          mkdir -p artifact

          TARGET_DIR="openwrt/bin/targets/mediatek/filogic"

          echo "===== TARGET DIRECTORY ====="
          find "${TARGET_DIR}" -maxdepth 2 -type f | sort || true

          echo "===== COLLECT TR3600 IMAGES ====="

          find "${TARGET_DIR}" -maxdepth 1 -type f \
            \( \
              -name '*cudy_tr3600-v1*' \
              -o \
              -name '*cudy_tr3600*' \
            \) \
            -exec cp -v {} artifact/ \; || true

          echo "===== COLLECT SYSUPGRADE ====="

          find "${TARGET_DIR}" -maxdepth 1 -type f \
            -name '*sysupgrade.bin' \
            -exec cp -v {} artifact/ \;

          echo "===== CONFIG ====="

          cp openwrt/.config artifact/config-used.txt

          printf '%s\n' \
            "${SOURCE_COMMIT}" \
            > artifact/source-commit.txt

          echo "===== CHECK SYSUPGRADE ====="

          if ! find artifact -type f -name '*sysupgrade.bin' | grep -q .; then
            echo "ERROR: No sysupgrade image was produced."
            echo
            echo "===== AVAILABLE FILES ====="
            find "${TARGET_DIR}" -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "===== SHA256 ====="

          (
            cd artifact
            sha256sum * > sha256sums.txt
          )

          echo "===== ARTIFACT ====="
          ls -lah artifact

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-ImmortalWrt-237-6.6
          path: artifact/
          if-no-files-found: error
          retention-days: 14
