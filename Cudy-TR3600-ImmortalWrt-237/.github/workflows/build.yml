name: Build TR3600

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "configs/**"
      - "scripts/**"
      - "files/**"
      - "patches/**"
      - "README.md"

permissions:
  contents: read

env:
  SOURCE_REPO: https://github.com/padavanonly/immortalwrt-mt798x-6.6.git
  SOURCE_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    name: TR3600 / ImmortalWrt 6.6 / 237
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget curl jq xsltproc swig time ccache rename \
            device-tree-compiler libelf-dev

      - name: Clone 237 ImmortalWrt 6.6
        run: |
          git clone --depth=1 --single-branch \
            -b "${SOURCE_BRANCH}" \
            "${SOURCE_REPO}" openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply TR3600 support and packages
        run: |
          chmod +x scripts/*.sh
          ./scripts/prepare.sh

      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: openwrt
        run: |
          cp ../configs/tr3600-237.config .config
          make defconfig

          echo "===== TARGET ====="
          grep -E 'CONFIG_TARGET_mediatek|CONFIG_TARGET_DEVICE.*tr3600' .config || true

          echo "===== FIREWALL ====="
          grep -E 'CONFIG_PACKAGE_(firewall3|firewall4|iptables|nftables)=' .config || true

      - name: Verify configuration
        working-directory: openwrt
        run: |
          ./../scripts/verify.sh

      - name: Compile
        working-directory: openwrt
        run: |
          make -j"$(nproc)" download
          make -j"$(nproc)" V=s

      - name: Collect firmware
        run: |
          mkdir -p artifact
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            \( -name '*cudy_tr3600-v1*' -o -name '*cudy_tr3600*' \) \
            -exec cp -v {} artifact/ \; || true

          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \
            -name '*sysupgrade.bin' -exec cp -v {} artifact/ \;

          cp openwrt/.config artifact/config-used.txt
          printf '%s\n' "${SOURCE_COMMIT}" > artifact/source-commit.txt

          if ! find artifact -type f -name '*sysupgrade.bin' | grep -q .; then
            echo "ERROR: No sysupgrade image was produced."
            find openwrt/bin/targets/mediatek/filogic -maxdepth 2 -type f | sort
            exit 1
          fi

          (
            cd artifact
            sha256sum * > sha256sums.txt
          )

          echo "===== ARTIFACT ====="
          ls -lah artifact

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-ImmortalWrt-237-6.6
          path: artifact/
          if-no-files-found: error
          retention-days: 14
